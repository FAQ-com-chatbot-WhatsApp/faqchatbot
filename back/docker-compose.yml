name: tic

services:
  # ---------------------------------------------------------------------------
  # Banco de Dados (PostgreSQL 18)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped

    # Carrega variáveis do .env (caso você use)
    env_file:
      - .env

    environment:
      TZ: ${POSTGRES_TZ:-UTC}
      POSTGRES_USER: dba
      POSTGRES_PASSWORD: dba
      POSTGRES_DB: BotDB

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"

    # Volume correto para PostgreSQL >= 18
    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dba -d BotDB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache e Filas (Redis)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Interface do Banco (Adminer)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    volumes:
      - ./adminer-dark.css:/var/www/html/adminer.css:ro

  # ---------------------------------------------------------------------------
  # WhatsApp API (Waha)
  # ---------------------------------------------------------------------------
  waha:
    image: devlikeapro/waha:chrome
    container_name: waha
    restart: unless-stopped

    env_file:
      - .env

    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-your-secret-api-key}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:-admin}

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - waha_data:/app/.sessions

    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000/ping || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Aplicação Principal (API)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-api # Usa target específico do Dockerfile
      # BuildKit para builds paralelos e cache otimizado
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      # Argumentos de build para otimização
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: tic-api:latest # Nome da imagem para reutilização
    container_name: api
    restart: unless-stopped
    env_file:
      - .env

    environment:
      PYTHONPATH: ${PYTHONPATH:-/app/src}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      SERVICE_NAME: "api"
      LOG_COLOR: "true"
      # Autoscaler tuning (kept for consistency; read by autoscaler)
      AUTOSCALER_MIN_WORKERS: ${AUTOSCALER_MIN_WORKERS:-3}
      AUTOSCALER_MAX_WORKERS: ${AUTOSCALER_MAX_WORKERS:-5}
      AUTOSCALER_SCALE_UP_THRESHOLD: ${AUTOSCALER_SCALE_UP_THRESHOLD:-5}
      AUTOSCALER_SCALE_DOWN_THRESHOLD: ${AUTOSCALER_SCALE_DOWN_THRESHOLD:-0}
      AUTOSCALER_IDLE_TIME_THRESHOLD: ${AUTOSCALER_IDLE_TIME_THRESHOLD:-300}

      # Database Config
      DATABASE_URL: postgresql+psycopg2://dba:dba@db:5432/BotDB
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: dba
      POSTGRES_PASSWORD: dba
      POSTGRES_DB: BotDB

      # Redis Config
      REDIS_URL: redis://redis:6379/0

      # Gemini (disable in dev if google.genai missing)
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-skip}

      # SMTP (Maildev em desenvolvimento)
      SMTP_HOST: maildev
      SMTP_PORT: 1025
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_SENDER: ${SMTP_SENDER:-no-reply@example.local}

      # WAHA (WhatsApp HTTP API) auth for server-to-server calls
      WAHA_API_KEY: ${WAHA_API_KEY:-your-secret-api-key}
      # Recomendação profissional:
      # SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}

    ports:
      - "127.0.0.1:3333:3333"

    # DESENVOLVIMENTO: Volume bind permite hot-reload
    # PRODUÇÃO: Comente esta linha para usar código do build
    volumes:
      - ./src:/app/src # Monta apenas /src para hot-reload, não sobrescreve dependências

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      maildev:
        condition: service_started
      waha:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3333/api/v1/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  # ---------------------------------------------------------------------------
  # RQ Workers (Processamento Assíncrono)
  # ---------------------------------------------------------------------------
  worker:
    # REUTILIZA imagem da API mas com target worker
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-worker # Usa target worker do Dockerfile consolidado
    image: tic-worker:latest
    # container_name removido porque replicas > 1
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PYTHONPATH: "/app/src"
      DATABASE_URL: postgresql+psycopg2://dba:dba@db:5432/BotDB
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: "worker"
      LOG_COLOR: "true"
      RQ_JOB_TIMEOUT_MESSAGE: 600
      TESTING: "1"
      SMTP_HOST: maildev
      SMTP_PORT: 1025
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_SENDER: ${SMTP_SENDER:-no-reply@example.local}
      # Autoscaler tuning (kept for consistency; read by autoscaler)
      AUTOSCALER_MIN_WORKERS: ${AUTOSCALER_MIN_WORKERS:-3}
      AUTOSCALER_MAX_WORKERS: ${AUTOSCALER_MAX_WORKERS:-5}
      AUTOSCALER_SCALE_UP_THRESHOLD: ${AUTOSCALER_SCALE_UP_THRESHOLD:-5}
      AUTOSCALER_SCALE_DOWN_THRESHOLD: ${AUTOSCALER_SCALE_DOWN_THRESHOLD:-0}
      AUTOSCALER_IDLE_TIME_THRESHOLD: ${AUTOSCALER_IDLE_TIME_THRESHOLD:-300}



    # Volumes para persistência
    volumes:
      - chroma_data:/app/data/chroma
     # - ./src:/app/src # Hot-reload em desenvolvimento

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      waha:
        condition: service_healthy

    # Escalar workers conforme necessário:
    # docker compose up -d --scale worker=2

    # NOTA: 'deploy.replicas' é ignorado em docker compose standalone
    # Use --scale worker=N para múltiplos workers em dev
    # Em produção (Swarm/K8s), descomente 'deploy' abaixo

    # deploy:
    #   replicas: 2
    #   restart_policy:
    #     condition: on-failure
    #     delay: 5s
    #     max_attempts: 3

    healthcheck:
      test: [ "CMD-SHELL", "python -c 'from robbot.infra.redis.client import get_redis_client; get_redis_client().ping()' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Polling Worker (Substitui webhooks não-funcionais do WEBJS)
  # ---------------------------------------------------------------------------
  polling-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-worker
    image: tic-polling-worker:latest
    container_name: polling-worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql+psycopg2://dba:dba@db:5432/BotDB
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: "polling-worker"
      LOG_COLOR: "true"
      WAHA_POLLING_INTERVAL: ${WAHA_POLLING_INTERVAL:-10}

    # DESENVOLVIMENTO: Volume bind permite hot-reload
    volumes:
      - ./src:/app/src

    command: python -m robbot.workers.polling_worker

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      waha:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "python -c 'from robbot.infra.redis.client import get_redis_client; get_redis_client().ping()' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Maildev (SMTP fake para desenvolvimento)
  # ---------------------------------------------------------------------------
  maildev:
    image: maildev/maildev:latest
    container_name: maildev
    restart: unless-stopped
    environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - "127.0.0.1:1080:1080" # UI web
      - "127.0.0.1:1025:1025" # SMTP

  # ---------------------------------------------------------------------------
  # Autoscaler (Ajuste automático de workers)
  # ---------------------------------------------------------------------------
  autoscaler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-autoscaler
    image: tic-autoscaler:latest
    container_name: autoscaler
    restart: unless-stopped
    user: "root"

    env_file:
      - .env

    environment:
      PYTHONPATH: /app/src
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://dba:dba@db:5432/BotDB
      AUTO_MIGRATE: "false"
      SERVICE_NAME: "autoscaler"
      LOG_COLOR: "true"
      AUTOSCALER_MIN_WORKERS: ${AUTOSCALER_MIN_WORKERS:-3}
      AUTOSCALER_MAX_WORKERS: ${AUTOSCALER_MAX_WORKERS:-5}
      AUTOSCALER_SCALE_UP_THRESHOLD: ${AUTOSCALER_SCALE_UP_THRESHOLD:-5}
      AUTOSCALER_SCALE_DOWN_THRESHOLD: ${AUTOSCALER_SCALE_DOWN_THRESHOLD:-0}
      AUTOSCALER_IDLE_TIME_THRESHOLD: ${AUTOSCALER_IDLE_TIME_THRESHOLD:-300}

    command: >
      sh -c "
        while true; do
          python /app/back/scripts/autoscale_workers.py
          sleep 120
        done
      "

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app/back:ro

    healthcheck:
      test: [ "CMD-SHELL", "test -f /app/back/scripts/autoscale_workers.py || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
  redis_data:
  waha_data:
  chroma_data:
