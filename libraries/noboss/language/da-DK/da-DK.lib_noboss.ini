LIB_NOBOSS_UTIL_CURL_ERROR_400_RANGE="Der var en fejl inden for område 400 under krølleanmodningen. Fejlkode: %s"
LIB_NOBOSS_UTIL_CURL_ERROR_500_RANGE="Der var en fejl inden for område 500 under krølleanmodningen. Fejlkode: %s"
LIB_NOBOSS_UTIL_CURL_ERROR_FALSE_RESPONSE="Serverens svar var falsk eller tomt for curl-anmodningen."
LIB_NOBOSS_UTIL_CURL_ERROR_SSL_ERROR_35="SSL-forbindelsesfejl (cURL-funktionsfejl 35). <br /> <br /> <b> Hovedårsager til denne fejl: </b> <br /> <b> 1 - SSL-protokol: </b> i de fleste tilfælde opstår fejlene i cURL PHP-versionerne af serveren. For eksempel kan cURL-kommandolinjen bruge den seneste version, og SSL-protokollen kan være forældet. Dette gælder især for forældede SSL-protokoller som SSLv2, SSLv3. Anbefalingen er at kontrollere cURL- og SSL-protokolversionerne og, hvis der er en versionsfejl, opgradere til den nyeste version. <br /><b> 2 - Forældet cURL-pakke:</b>en forældet cURL-pakke på servere kan vise SSL-forbindelsesfejl. Du kan tjekke serverversionen af ​​curl via SSH ved at bruge kommandoen 'rpm -qa | grep curl'. Opdateringen, afhængig af apache-versionen, kan udføres med kommandoen 'yum update -y nss'. <br /><b>3 - Problemer genereret ved at tilpasse cURL-konfigurationen: </b>forkert konfiguration af PHP cURL-konfigurationsfilen fører til fejl 35. Hvis cURL-konfigurationen er blevet tilpasset, er det nødvendigt at revidere den. <br /><b>4 - Firewall-begrænsninger: </b>kan forekomme på grund af firewall-begrænsninger på serveren. For eksempel, når netværksadministratorer forbyder SSL-forbindelser, finder der ingen datatransaktioner sted til eller fra serveren."
LIB_NOBOSS_UTIL_CURL_ERROR_MSG_FUNCTION="Meddelelse returneret af PHP curl_error funktion"
LIB_NOBOSS_UTIL_CURL_ERROR_MSG_LINK_TEST=" <b> Sådan rettes fejlen: </b> <br /> Kontakt det team, der er ansvarligt for at hoste webstedet for at løse problemet. <br /> Jeg sendte dem et print af denne skærm og angiv linket nedenfor, så de kan simulere fejlen."

