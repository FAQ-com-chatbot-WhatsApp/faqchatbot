LIB_NOBOSS_UTIL_CURL_ERROR_FALSE_RESPONSE="Palvelimen vastaus curl-pyynnölle oli false tai tyhjä."
LIB_NOBOSS_UTIL_CURL_ERROR_SSL_ERROR_35="SSL-yhteysvirhe (cURL-funktiovirhe 35). <br /><br /><b>Virheen pääasialliset syyt:</b><br /><b>1 - SSL-protokolla:</b> useimmissa tapauksissa virheitä esiintyy palvelimen PHP cURL -versioissa. Esimerkiksi cURL-komentorivi saattaa käyttää uusinta versiota ja SSL-protokolla voi olla vanhentunut. Tämä pätee erityisesti vanhentuneisiin SSL-protokolliin, kuten SSLv2 ja SSLv3. Suositus on tarkistaa cURL- ja SSL-protokollaversiot ja jos versioissa on eroja, päivittää uusimpaan versioon. <br /> <b>2 - Vanhentunut cURL-paketti:</b> Vanhentunut cURL-paketti palvelimilla saattaa näyttää SSL-yhteysvirheen. Voit tarkistaa palvelimen curl-version SSH:n kautta komennolla 'rpm -qa | grep curl'. Päivitys voidaan Apachen versiosta riippuen suorittaa komennolla 'yum update -y nss'. <br /><b> 3 - cURL-määrityksen mukauttamisesta aiheutuvat ongelmat:</b> PHP:n cURL-määritystiedoston virheellinen määritys johtaa virheeseen 35. Jos cURL-määrityksiä on mukautettu, ne on tarkistettava.<br /><b> 4 - Palomuurin rajoitukset: </b> voi johtua palvelimen palomuurirajoituksista. Esimerkiksi kun verkonvalvojat kieltävät SSL-yhteydet, palvelimelle tai palvelimelta ei tapahdu datasiirtoja."
LIB_NOBOSS_UTIL_CURL_ERROR_MSG_FUNCTION="PHP:n curl_error-funktion palauttama viesti"
LIB_NOBOSS_UTIL_CURL_ERROR_MSG_LINK_TEST="<b>Virheen korjaaminen:</b><br />Ota yhteyttä verkkosivuston ylläpidosta vastaavaan tiimiin, jotta he voivat korjata ongelman. <br />Lähetin heille tulosteen tästä näyttökuvasta ja annoin alla olevan linkin, jotta he voivat simuloida virheen."

