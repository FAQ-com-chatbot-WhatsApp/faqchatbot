openapi: 3.0.3
info:
  title: FAQ Chatbot Conversational Platform API
  version: 0.1.0
  description: API REST sobre Joomla para fluxos conversacionais.
servers:
  - url: http://localhost:8080/api
    description: Local dev
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        meta: { type: object }
    Flow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        version: { type: integer }
        definition: { type: object }
    Conversation:
      type: object
      properties:
        id: { type: string }
        contact_id: { type: string }
        flow_id: { type: string }
        status: { type: string, enum: [active, completed, abandoned] }
        message_count: { type: integer }
    Message:
      type: object
      properties:
        id: { type: string }
        conversation_id: { type: string }
        direction: { type: string, enum: [in, out] }
        type:
          {
            type: string,
            enum: [text, image, audio, video, document, interactive],
          }
        content: { type: object }
        status: { type: string }
    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    AuthLoginResponse:
      type: object
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        refresh_token: { type: string }
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Login e obtenção de JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLoginRequest" }
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthLoginResponse" }
        "401": { description: Credenciais inválidas }
  /health/ping:
    get:
      summary: Verifica saúde da API
      security: []
      responses:
        "200":
          description: Status OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  time: { type: string }
                  app: { type: string }
  /conversations:
    post:
      summary: Cria nova conversa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_id]
              properties:
                contact_id: { type: string }
                flow_id: { type: string }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
  /messages:
    post:
      summary: Envia mensagem (interno ou saída)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, type, content]
              properties:
                conversation_id: { type: string }
                type: { type: string }
                direction: { type: string, enum: [in, out] }
                content: { type: object }
      responses:
        "201": { description: Mensagem registrada }
        "404": { description: Conversa não encontrada }
