COM_NOBOSSFAQ_FILTER_LINK_TAB="Filtert op url"
COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="Op dit tabblad wordt uitgelegd hoe u twee soorten url-filters voor uw veelgestelde vragen kunt maken:<br> <b> 1 - Filter voor vraag</b>: laadt de pagina en laat de gefilterde vraag samen met het antwoord zichtbaar.<br> <b>2 - Filter voor categorie </b>: laadt de pagina met alleen vragen uit de gefilterde categorie."
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_INTRO="Eerste stap:"
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; Voor elk van de filters is het eerste wat u moet doen de url opvragen van de pagina waar de FAQ zal worden geladen. <br> &bull; Voorbeeld url:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Filter voor vraag maken:"

COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Je hoeft alleen maar de volgende informatie toe te voegen aan het einde van je URL: %s <br>  &nbsp;&nbsp;&nbsp; &bull; Houd er rekening mee dat <b>%s</b> is de vraag-ID .<br> &nbsp;&nbsp;&nbsp; &bull; Als de vraag een Joomla-artikel is, moet u %s invoeren, en in plaats van XXX moet u vul het artikel-ID in.<br> &bull; Voorbeeld van hoe de url eruit zou zien met het filter: %s  <br> &bull; Bij toegang tot deze url wordt de gebruiker doorgestuurd naar de locatie van de pagina waar de FAQ wordt weergegeven, waarbij de gefilterde vraag wordt gemarkeerd."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Categoriefilter maken:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; U hoeft alleen de volgende informatie aan het einde van uw url toe te voegen: %s<br> &nbsp;&nbsp;&nbsp; &bull; Houd er rekening mee dat <b>%s</b> de ID is van de categorie die is gekoppeld aan deze vraag die u aan het bewerken bent. <br> &bull; Voorbeeld van hoe de url eruit zou zien met het filter: %s<br> &bull; Bij het openen van deze url wordt de gebruiker doorverwezen naar de locatie op de pagina waar de FAQ wordt weergegeven, waardoor de gefilterde categorie in de zoekbalk. <br> &bull; <b>Belangrijk:</b> om dit filter te gebruiken, moet u zoeken op categorie inschakelen in de lay-outaanpassing voor veelgestelde vragen."
COM_NOBOSSFAQ_FILTER_LINK_NOT_SAVE=" <b> Let op: </b> je moet eerst het record opslaan om de routebeschrijving te kunnen zien."

