COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="Tällä välilehdellä selitetään, kuinka luodaan kahdenlaisia URL-suodattimia usein kysyttyihin kysymyksiin: <br><b>1 - Suodatin kysymykselle</b>: lataa sivun jättäen suodatetun kysymyksen ja sen vastauksen näkyviin. <br><b>2 - Suodatin luokalle</b>: lataa sivun, joka näyttää vain suodatetun luokan kysymykset."
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_INTRO="Ensimmäinen vaihe:"
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; Kaikkien suodattimien kohdalla sinun on ensin haettava sen sivun URL-osoite, jolle usein kysytyt kysymykset ladataan.<br>&bull; Esimerkki URL-osoitteesta:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Suodattimen luominen kysymykselle:"

COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Sinun tarvitsee vain lisätä seuraavat tiedot URL-osoitteesi loppuun: %s <br> &nbsp;&nbsp;&nbsp; &nbsp; &bull; Huomaa, että <b>%s</b> on kysymyksen ID.<br> &nbsp;&nbsp;&nbsp; &bull; Jos kysymys on Joomla-artikkeli, on tarpeen laittaa %s, ja XXX:n tilalle sinun on täytettävä artikkelin tunnus. <br> &bull; Esimerkki siitä, miltä URL-osoite näyttäisi suodattimen kanssa: %s <br> &bull; Tätä URL-osoitetta käytettäessä käyttäjä ohjataan sivun siihen kohtaan, jossa usein kysytyt kysymykset näkyvät, ja suodatettu kysymys korostetaan."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Suodattimen luominen kategorialle:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; Sinun tarvitsee vain lisätä seuraavat tiedot URL-osoitteesi loppuun: %s <br> &nbsp;&nbsp;&nbsp; &nbsp; &bull; Huomaa, että <b>%s</b> on tähän muokkaamaasi kysymykseen linkitetyn luokan tunnus. <br> &bull; Esimerkki siitä, miltä URL-osoite näyttäisi suodattimen kanssa: %s <br> &bull; Tätä URL-osoitetta käytettäessä käyttäjä ohjataan sivun siihen kohtaan, jossa usein kysytyt kysymykset näkyvät, jolloin suodatettu luokka tulee esiin hakupalkissa. <br> &bull; <b>Tärkeää:</b> Tämän suodattimen käyttämiseksi sinun on otettava käyttöön luokkahaku usein kysyttyjen kysymysten asettelun mukauttamisessa."
COM_NOBOSSFAQ_FILTER_LINK_NOT_SAVE="<b>Huomio:</b> sinun on ensin tallennettava tietue, jotta voit tarkastella ohjeita."

