; COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="Nesta aba é explicado como criar dois tipos de filtros de url para sua FAQ: <br><b>1 - Filtro para pergunta</b>: carrega a página deixando visível a pergunta filtrada junto com a sua resposta. <br><b>2 - Filtro para categoria</b>: carrega a página exibindo somente perguntas da categoria filtrada."
