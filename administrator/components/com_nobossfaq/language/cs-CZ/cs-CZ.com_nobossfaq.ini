; COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; Para qualquer um dos filtros, a primeira coisa que você precisa fazer é obter a url da página onde a FAQ será carregada.<br>&bull; Exemplo de url:"
; COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Criando filtro para pergunta:"

; COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Você só precisa acrescentar a seguinte informação no final da sua url: %s <br> &nbsp;&nbsp;&nbsp; &bull; Note que <b>%s</b> é o ID da pergunta.<br> &nbsp;&nbsp;&nbsp; &bull; Se a pergunta for um artigo Joomla, é necessário colocar %s, sendo que no lugar de XXX você deve prencher o ID do artigo.<br> &bull; Exemplo de como ficaria a url com o filtro: %s <br> &bull; Ao acessar essa url, o usuário será direcionado até o local da página onde a FAQ está sendo exibida, destacando a pergunta filtrada."



; COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Criando filtro para categoria:"
; COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; Você só precisa acrescentar a seguinte informação no final da sua url: %s <br> &nbsp;&nbsp;&nbsp; &bull; Note que <b>%s</b> é o ID da categoria que está vinculada a essa pergunta que você está editando. <br> &bull; Exemplo de como ficaria a url com o filtro: %s <br> &bull; Ao acessar essa url, o usuário será direcionado até o local da página onde a FAQ está sendo exibida, trazendo a categoria filtrada na barra de pesquisa. <br> &bull; <b>Importante:</b> para utilizar esse filtro você precisa habilitar a busca de categorias na personalização do layout da FAQ."
