; View de edicao pergunta - Aba de filtros para url
COM_NOBOSSFAQ_FILTER_LINK_TAB="Filtri su URL"
COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="Questa scheda spiega come creare due tipi di filtri url per le tue FAQ: <br> <b> 1 - Filtro per domanda</b>: carica la pagina lasciando visibile la domanda filtrata insieme alla sua risposta. <br> <b> 2 - Filtro per categoria</b>: carica la pagina visualizzando solo le domande della categoria filtrata."
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_INTRO="Primo passo:"
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; Per qualsiasi filtro, la prima cosa che devi fare è ottenere l'URL della pagina in cui verrà caricata la FAQ. <br> &bull; URL di esempio:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Creazione del filtro per la domanda:"

COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Devi solo aggiungere le seguenti informazioni alla fine del tuo URL: %s <br> &nbsp;&nbsp;&nbsp; &bull;  Tieni presente che <b>%s</b> è l'ID domanda .<br> &nbsp;&nbsp;&nbsp; &bull; Se la domanda è un articolo Joomla, devi inserire %s, e al posto di XXX devi inserisci l'ID articolo.<br> &bull; Esempio di come apparirebbe l'URL con il filtro: %s  <br> &bull; Quando si accede a questo URL, l'utente verrà indirizzato alla posizione della pagina in cui vengono visualizzate le FAQ, evidenziando la domanda filtrata."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Creazione del filtro di categoria:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; Devi solo aggiungere le seguenti informazioni alla fine del tuo URL: %s<br> &nbsp;&nbsp;&nbsp; &bull; Nota che <b>%s</b> è l'ID della categoria collegata a questa domanda che stai modificando. <br> &bull; Esempio di come apparirebbe l'URL con il filtro: %s<br> &bull; Quando si accede a questo URL, l'utente verrà indirizzato alla posizione della pagina in cui viene visualizzata la FAQ, portando la categoria filtrata nella barra di ricerca. <br> &bull; <b>Importante:</b> per utilizzare questo filtro è necessario abilitare la ricerca per categoria nella personalizzazione del layout delle FAQ."
COM_NOBOSSFAQ_FILTER_LINK_NOT_SAVE=" <b> Attenzione: </b> è necessario salvare prima il record per poter visualizzare le indicazioni."

