; View de edicao pergunta - Aba de filtros para url
COM_NOBOSSFAQ_FILTER_LINK_TAB="Filtres sur URL"
COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="Cet onglet explique comment créer deux types de filtres d'url pour votre FAQ: <br> <b> 1 - Filtre pour la question </b>: charge la page en laissant visible la question filtrée ainsi que sa réponse. <br> <b> 2 - Filtre pour la catégorie </b>: charge la page affichant uniquement les questions de la catégorie filtrée."
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_INTRO="Premier pas:"
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; Pour tous les filtres, la première chose à faire est d'obtenir l'url de la page où la FAQ sera chargée. <br> &bull; Exemple d'URL:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Création d'un filtre pour la question:"

COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Il vous suffit d'ajouter les informations suivantes à la fin de votre url: %s <br> &nbsp;&nbsp;&nbsp; &bull;  Notez que <b>%s</b> est l'ID de la question .<br> &nbsp;&nbsp;&nbsp; &bull; Si la question est un article de Joomla, vous devez saisir %s, et au lieu de XXX vous devez renseignez l'ID de l'article.<br> &bull; Exemple de ce à quoi ressemblerait l'url avec le filtre: %s  <br> &bull; Lors de l'accès à cette URL, l'utilisateur sera dirigé vers l'emplacement de la page où la FAQ s'affiche, mettant en évidence la question filtrée."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Création d'un filtre de catégorie:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; Il vous suffit d'ajouter les informations suivantes à la fin de votre URL: %s<br> &nbsp;&nbsp;&nbsp; &bull; Notez que <b>%s</b> est l'ID de la catégorie liée à cette question que vous modifiez. <br> &bull; Exemple de l'apparence de l'url avec le filtre : %s<br> &bull; En accédant à cette URL, l'utilisateur sera dirigé vers l'emplacement de la page où la FAQ est affichée, amenant la catégorie filtrée dans le barre de recherche. <br> &bull; <b>Important :</b> pour utiliser ce filtre, vous devez activer la recherche par catégorie dans la personnalisation de la mise en page de la FAQ."
COM_NOBOSSFAQ_FILTER_LINK_NOT_SAVE="<b>Attention:</b> vous devez d'abord sauvegarder l'enregistrement afin de voir les directions."

