COM_NOBOSSFAQ_FILTER_LINK_TAB="Filtros en URL"
COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="Esta pestaña explica cómo crear dos tipos de filtros de URL para sus preguntas frecuentes: <br> <b> 1 - Filtro para pregunta</b>: carga la página dejando visible la pregunta filtrada junto con su respuesta. <br> <b> 2 - Filtro por categoría</b>: carga la página que muestra solo las preguntas de la categoría filtrada."
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_INTRO="Primer paso:"
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; Para cualquiera de los filtros, lo primero que debe hacer es obtener la URL de la página donde se cargarán las preguntas frecuentes. <br> &bull; Ejemplo de URL:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Creando filtro para pregunta:"

COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Solo necesita agregar la siguiente información al final de su URL: %s <br>&nbsp;&nbsp;&nbsp; &bull;  Tenga en cuenta que <b>%s</b> es el ID de la pregunta.<br> &nbsp;&nbsp;&nbsp; &bull; Si la pregunta es un artículo de Joomla, debe ingresar %s, y en lugar de XXX debe complete el ID del artículo.<br> &bull; Ejemplo de cómo se vería la URL con el filtro: %s  <br> &bull; Al acceder a esta URL, el usuario será dirigido a la ubicación de la página donde Se muestran las preguntas frecuentes, resaltando la pregunta filtrada."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Creando filtro de categoría:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; Solo necesita agregar la siguiente información al final de su URL: %s<br> &nbsp;&nbsp;&nbsp; &bull; Tenga en cuenta que <b>%s</b> es el ID de la categoría que está vinculada a esta pregunta que está editando. <br> &bull; Ejemplo de cómo se vería la URL con el filtro:%s<br> &bull; Al acceder a esta URL, el usuario será dirigido a la ubicación en la página donde se muestran las preguntas frecuentes, trayendo la categoría filtrada en el barra de búsqueda. <br> &bull; <b> Importante: </b> para utilizar este filtro, debe habilitar la búsqueda de categorías en la personalización del diseño de las preguntas frecuentes."
COM_NOBOSSFAQ_FILTER_LINK_NOT_SAVE=" <b> Atención: </b> primero debe guardar el registro para ver las direcciones."

