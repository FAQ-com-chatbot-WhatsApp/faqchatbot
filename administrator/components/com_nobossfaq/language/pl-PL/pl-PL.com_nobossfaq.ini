COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Tworzę filtr dla pytania:"

COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Wystarczy, że na końcu adresu URL dodasz następujące informacje: %s <br> &nbsp;&nbsp;&nbsp; &bull;  Pamiętaj, że <b>%s</b> to identyfikator pytania .<br> &nbsp;&nbsp;&nbsp; &bull; Jeśli pytanie dotyczy artykułu w Joomla, musisz wpisać %s, a zamiast XXX musisz uzupełnij identyfikator artykułu.<br> &bull; Przykładowy wygląd adresu URL po zastosowaniu filtra: %s  <br> &bull; Podczas uzyskiwania dostępu do tego adresu URL użytkownik zostanie przekierowany do lokalizacji strony, na której wyświetli się FAQ, podświetlając przefiltrowane pytanie."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Tworzenie filtra kategorii:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; Wystarczy dodać następujące informacje na końcu adresu URL: %s<br> &nbsp;&nbsp;&nbsp; &bull; Pamiętaj, że <b>%s</b> to identyfikator kategorii powiązanej z tym pytaniem, które edytujesz. <br> &bull; Przykładowy wygląd adresu URL z filtrem: %s<br> &bull; Podczas uzyskiwania dostępu do tego adresu URL użytkownik zostanie przekierowany do lokalizacji na stronie, na której wyświetlane jest FAQ, przenosząc przefiltrowaną kategorię do pasek wyszukiwania. <br> &bull; <b>Ważne:</b> aby użyć tego filtra, musisz włączyć wyszukiwanie kategorii w dostosowywaniu układu FAQ."
