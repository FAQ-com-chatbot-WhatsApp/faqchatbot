; View de edicao pergunta - Aba de filtros para url
COM_NOBOSSFAQ_FILTER_LINK_TAB="Filtres a l'URL"
COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="Aquesta pestanya explica com crear dos tipus de filtres d'URL per a les vostres FAQ: <br> <b> 1 - Filtre per a la pregunta </b> : carrega la pàgina deixant visible la pregunta filtrada juntament amb la seva resposta. <br> <b> 2 - Filtre per la categoria </b> : carrega la pàgina mostrant només preguntes de la categoria filtrada."
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_INTRO="Primer pas:"
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; Per qualsevol dels filtres, el primer que heu de fer és obtenir l'url de la pàgina on es carregaran les FAQ. <br> &bull; Exemple d'URL:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Creant filtre per la pregunta:"

COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Només heu d'afegir la informació següent al final de la vostra URL: %s <br> &nbsp;&nbsp;&nbsp; &bull; Tingueu en compte que <b>%s</b> és l'identificador de la pregunta..<br> &nbsp;&nbsp;&nbsp; &bull; Si la pregunta és un article de Joomla, heu d'introduir %s, i en comptes de XXX heu d'emplenar l'ID de l'article.<br> &bull; Exemple de com seria l'URL amb el filtre: %s <br> &bull; En accedir a aquesta url, l'usuari serà dirigit a la ubicació de la pàgina on es mostren les PMF, ressaltant la pregunta filtrada."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Creació del filtre de categoria:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; Només necesita agregar la següent informació al final de la seva URL: %s<br> &nbsp;&nbsp;&nbsp; &bull; Tingui en compte que <b>%s</b> l'ID de la categoria que está vinculada a aquesta pregunta que está editand. <br> &bull; Exemple de com es veuria l'URL amb el filtre:%s<br> &bull; Quan accedeixi a aquesta URL, l'usuario será redirigit a l' ubicació de la página on es mostren les preguntes freqüents, amb la categoria filtrada a la barra de cerca. <br> &bull; <b> Important: </b> per utilitzar aquest filtre, heu d'habilitar la cerca de categories en la personalització del disseny de les preguntes freqüents."
COM_NOBOSSFAQ_FILTER_LINK_NOT_SAVE=" <b> Atenció: </b> primer cal desar el registre per veure les indicacions."

