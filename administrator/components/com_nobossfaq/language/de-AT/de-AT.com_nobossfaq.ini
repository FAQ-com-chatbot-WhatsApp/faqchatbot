COM_NOBOSSFAQ_FILTER_LINK_TAB="Filter auf URL"
COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="Diese Registerkarte erklärt, wie Sie zwei Arten von URL-Filtern für Ihre FAQ erstellen: <br> <b> 1 - Filter für Frage</b>: Lädt die Seite und lässt die gefilterte Frage zusammen mit ihrer Antwort sichtbar. <br> <b> 2 - Filter für Kategorie</b>: lädt die Seite, die nur Fragen aus der gefilterten Kategorie anzeigt."
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_INTRO="Erster Schritt:"
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; Für jeden der Filter müssen Sie als erstes die URL der Seite abrufen, auf der die FAQ geladen werden. <br> &bull; Beispiel-URL:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Filter für Frage erstellen:"

COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Sie müssen nur die folgenden informationen am ende Ihrer URL hinzufügen: %s <br> &nbsp;&nbsp;&nbsp; &bull;  Beachten sie, dass <b>%s</b> ist die frage-ID .<br> &nbsp;&nbsp;&nbsp; &bull; Wenn es sich bei der frage um einen Joomla-artikel handelt, müssen sie %s und anstelle von XXX eingeben geben sie die artikel-ID ein.<br> &bull; Beispiel dafür, wie die URL mit dem filter aussehen würde: %s  <br> &bull; Beim zugriff auf diese URL wird der benutzer zum speicherort der seite weitergeleitet, auf der er sich befindet die FAQ wird angezeigt und markiert die gefilterte frage."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Kategoriefilter erstellen:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; Sie müssen nur die folgenden Informationen am Ende Ihrer URL hinzufügen: %s<br> &nbsp;&nbsp;&nbsp; &bull; Beachten Sie, dass <b>%s</b> die ID der Kategorie ist, die mit dieser Frage verknüpft ist, die Sie bearbeiten. <br> &bull; Beispiel, wie die URL mit dem Filter aussehen würde: %s<br> &bull; Beim Zugriff auf diese URL wird der Benutzer an die Stelle auf der Seite weitergeleitet, auf der die FAQ angezeigt wird, und bringt die gefilterte Kategorie in die Suchleiste. <br> &bull; <b>Wichtig:</b> Um diesen Filter zu verwenden, müssen Sie die Kategoriesuche in der FAQ-Layout-Anpassung aktivieren."
COM_NOBOSSFAQ_FILTER_LINK_NOT_SAVE=" <b> Achtung: </b> Sie müssen den Datensatz zuerst speichern, um die Wegbeschreibung anzuzeigen."

