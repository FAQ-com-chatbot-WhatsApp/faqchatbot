COM_NOBOSSFAQ_FILTER_LINK_TAB="Фільтри за URL-адресою"
COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="На цій вкладці пояснюється, як створити два типи URL-фільтрів для часто заданих питань: <br> <b> 1 - Фільтр для запитання</b>: завантажує сторінку, залишаючи видимим відфільтроване запитання разом із відповіддю. <br> <b> 2 - Фільтр для категорії</b>: завантажує сторінку, що відображає лише запитання з відфільтрованої категорії."
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_INTRO="Перший крок:"
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; Для будь-якого з фільтрів перше, що вам потрібно зробити, це отримати URL-адресу сторінки, де будуть завантажені FAQ. <br> &bull; Приклад URL-адреси:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Створення фільтра для запитання:"

COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Вам просто потрібно додати таку інформацію в кінці URL-адреси: %s <br> &nbsp;&nbsp;&nbsp; &bull;  Зауважте, що <b>%s</b> є ідентифікатор запитання.<br> &nbsp;&nbsp;&nbsp; &bull; Якщо запитання стосується статті Joomla, ви повинні ввести %s, а замість XXX ви повинні введіть ідентифікатор статті.<br> &bull; Приклад того, як виглядатиме URL-адреса з фільтром: %s  <br> &bull; Під час доступу до цієї URL-адреси користувач буде спрямовано на сторінку, де відображається FAQ, підсвічуючи відфільтроване запитання."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Створення фільтра категорій:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; Вам просто потрібно додати таку інформацію до кінця вашої URL-адреси: %s<br> &nbsp;&nbsp;&nbsp; &bull; Зверніть увагу, що <b>%s</b> - це ідентифікатор категорії, яка пов’язана з цим питанням, яке ви редагуєте. <br> &bull; Приклад того, як виглядатиме URL-адреса з фільтром:%s<br> &bull; Під час доступу до цієї URL-адреси користувач буде перенаправлений до місця на сторінці, де відображається FAQ, і відфільтрована категорія входить у рядок пошуку. <br> &bull; <b> Важливо: </b> для використання цього фільтра потрібно ввімкнути пошук за категоріями в налаштуванні макету FAQ."
COM_NOBOSSFAQ_FILTER_LINK_NOT_SAVE=" <b> Увага: </b> Вам потрібно спочатку зберегти запис, щоб переглянути напрямки."

