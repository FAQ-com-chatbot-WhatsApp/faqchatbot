COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; URL'nizin sonuna aşağıdaki bilgileri eklemeniz yeterlidir: %s <br> &nbsp;&nbsp;&nbsp; &bull;  Şunu unutmayın: <b>%s</b> soru kimliğidir .<br> &nbsp;&nbsp;&nbsp; &bull; Soru bir Joomla makalesiyse, %s girmelisiniz ve XXX yerine  makale kimliğini doldurmalısınız<br> &bull; Bağlantının filtreyle nasıl görüneceğine ilişkin örnek: %s  <br> &bull; Bu bağlantıya erişirken kullanıcı, filtrelenen soruyu vurgulayarak SSS'nin görüntülendiği sayfanın konumuna yönlendirilecektir."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Kategori filtresi oluşturma:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; URL'nizin sonuna aşağıdaki bilgileri eklemeniz yeterlidir: %s<br> &nbsp;&nbsp;&nbsp; &bull; <b>%s</b> ögesinin, düzenlediğiniz bu soruyla bağlantılı kategorinin kimliği olduğunu unutmayın. <br> &bull; URL'nin filtreyle nasıl görüneceğine dair örnek: %s<br> &bull; Bu URL'ye erişirken, kullanıcı sss'nin görüntülendiği sayfadaki konuma yönlendirilecek ve filtrelenmiş kategoriyi arama çubuğuna getirecektir. <br> &bull; <b>Önemli:</b> Bu filtreyi kullanmak için SSS yerleşim özelleştirmesinde kategori aramayı etkinleştirmeniz gerekir."
