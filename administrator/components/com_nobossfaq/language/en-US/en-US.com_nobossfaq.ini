COM_NOBOSSFAQ_FILTER_LINK_TAB="Filters on url"
COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="This tab explains how to create two types of url filters for your FAQ: <br> <b> 1 - Filter for question </b>: loads the page leaving visible the filtered question along with its answer. <br> <b> 2 - Filter for category </b>: loads the page displaying only questions from the filtered category."
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_INTRO="First step:"
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; For any of the filters, the first thing you need to do is get the url of the page where the FAQ will be loaded. <br> &bull; Example url:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Creating filter for question:"

COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; You just need to add the following information at the end of your url: %s <br> &nbsp;&nbsp;&nbsp; &bull;  Note that <b>%s</b> is the question ID. <br> &nbsp;&nbsp;&nbsp; &bull; If the question is a Joomla article, you must enter %s, and instead of XXX you must fill in the article ID.<br> &bull; Example of what the url would look like with the filter: %s  <br> &bull; When accessing this url, the user will be directed to the location of the page where the FAQ is being displayed , highlighting the filtered question."



COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Creating category filter:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; You just need to add the following information to the end of your url: %s<br> &nbsp;&nbsp;&nbsp; &bull; Note that <b>%s</b> is the ID of the category that is linked to this question you are editing. <br> &bull; Example of how the url would look with the filter: %s<br> &bull; When accessing this url, the user will be directed to the location on the page where the FAQ is being displayed, bringing the filtered category in the search bar. <br> &bull; <b>Important:</b> to use this filter you need to enable category search in the FAQ layout customization."
COM_NOBOSSFAQ_FILTER_LINK_NOT_SAVE=" <b> Attention: </b> you need to save the record first in order to view the directions."

