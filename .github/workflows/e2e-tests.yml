"""
GitHub Actions CI/CD workflow for E2E tests.

This workflow:
1. Runs on every push and pull request
2. Starts required services (PostgreSQL, Redis, WAHA)
3. Runs E2E tests with coverage
4. Uploads coverage reports
"""

name: E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "back/**"
      - ".github/workflows/e2e-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "back/**"

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: clinica_go_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:test_password@localhost:5432/clinica_go_test
      REDIS_URL: redis://localhost:6379
      API_BASE_URL: http://localhost:3333/api/v1
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./back
        run: |
          python -m pip install --upgrade pip uv
          uv pip install -e ".[dev]"
          uv pip install pytest-cov pytest-xdist

      - name: Run database migrations
        working-directory: ./back
        run: |
          alembic upgrade head

      - name: Start API server (background)
        working-directory: ./back
        run: |
          uvicorn robbot.main:app --host 0.0.0.0 --port 3333 --reload &
          sleep 5

      - name: Run E2E smoke tests
        working-directory: ./back
        run: |
          pytest tests/e2e -m smoke -v --tb=short

      - name: Run E2E tests (Phase 1-3)
        working-directory: ./back
        run: |
          pytest tests/e2e -m "phase1 or phase2 or phase3" -v --tb=short

      - name: Run E2E tests (Phase 4-6)
        working-directory: ./back
        run: |
          pytest tests/e2e -m "phase4 or phase5 or phase6" -v --tb=short

      - name: Run E2E tests (Phase 7-10)
        working-directory: ./back
        run: |
          pytest tests/e2e -m "phase7 or phase8 or phase9 or phase10" \
            -v --tb=short

      - name: Generate coverage report
        working-directory: ./back
        if: always()
        run: |
          pytest tests/e2e \
            --cov=src/robbot \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./back/coverage.xml
          flags: e2e
          name: e2e-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: ./back/htmlcov/

      - name: Report test results
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
          echo "📊 Coverage report available in artifacts" >> $GITHUB_STEP_SUMMARY

  lint-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./back
        run: |
          python -m pip install --upgrade pip uv
          uv pip install ruff

      - name: Lint test code
        working-directory: ./back
        run: |
          ruff check tests/e2e/
          ruff format --check tests/e2e/
